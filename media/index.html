<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEI Media Engine | Genesis Engineered Interpretations</title><meta name="description" content="Explore the GEI Media Engine for images, video, audio, interactive books, and visual research experiences."><meta name="author" content="Genesis Engineered Interpretations"><meta name="robots" content="index,follow"><link rel="canonical" href="https://yalltoo.com/media/"><meta property="og:title" content="GEI Media Engine"><meta property="og:description" content="GEI images, video, audio, interactive books, and research media architecture."><meta property="og:type" content="website"><link rel="stylesheet" href="media.css"></head><body><main><header class="top"><div><div class="eyebrow">YALLTOO • GEI MEDIA</div><strong>GENESIS ENGINEERED INTERPRETATIONS</strong></div><a class="filters" href="../">Control Room</a></header><section class="hero"><div class="eyebrow">V0.8 • MEDIA ENGINE</div><h1>Knowledge, in motion.</h1><p class="muted">A unified media layer for GEI visual research, narrated learning, video, audio, and interactive publications. Media records can later connect to the Vault and Commerce entitlement layer.</p></section><nav class="filters" aria-label="Media types" id="filters"></nav><section><div class="grid" id="grid" aria-live="polite"></div></section><dialog id="viewer"><button class="close" id="close" aria-label="Close media viewer">Close</button><div id="detail"></div></dialog></main><script src="media-data.js"></script><script src="media-engine.js"></script><script>const grid=document.querySelector('#grid'),filters=document.querySelector('#filters'),viewer=document.querySelector('#viewer'),detail=document.querySelector('#detail');const types=['all','image','video','audio','book'];function render(type='all'){filters.innerHTML=types.map(t=>`<button class="${t===type?'active':''}" data-filter="${t}">${t}</button>`).join('');const list=GEI_MEDIA_ENGINE.filter(type);grid.innerHTML=list.map(a=>`<article class="card ${a.access==='premium'?'premium':''}"><span class="tag">${a.type} · ${a.access}</span><h3>${a.title}</h3><p class="muted">${a.description}</p><p class="muted">${a.status}</p><button class="btn" data-open="${a.id}">Inspect media</button></article>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>render(b.dataset.filter));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMedia(b.dataset.open))}function openMedia(id){const a=GEI_MEDIA_ENGINE.select(id);if(!a)return;detail.innerHTML=`<div class="eyebrow">${a.type.toUpperCase()}</div><h2>${a.title}</h2><p>${a.description}</p><div class="player"><strong>Media status:</strong> ${a.status}<br><strong>Access:</strong> ${a.access}<br><strong>MIME:</strong> ${a.mime}<br><span class="muted">No media file is bundled in V0.8 for planned assets. This viewer is the catalog/experience layer.</span></div>`;viewer.showModal()}document.querySelector('#close').onclick=()=>viewer.close();render();</script></body></html>
